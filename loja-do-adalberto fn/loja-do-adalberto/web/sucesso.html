<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Confira a confirmação e o resumo da sua compra simulada na Loja do Adalberto.">
  <title>Loja do Adalberto | Compra concluída</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111923">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Loja do Adalberto | Invenções impossíveis">
  <meta property="og:description" content="Confira a confirmação e o resumo da sua compra simulada na Loja do Adalberto.">
  <meta property="og:image" content="img/caneta.webp">
  <meta property="og:image:alt" content="Caneta de Desenhar Portais">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>
  <header class="site-header">
    <nav class="navbar" aria-label="Navegação principal">
      <div class="container"><a class="navbar-brand" href="index.html"><img src="img/logo.webp" alt="Loja do Adalberto" class="logo" width="140" height="70"></a></div>
    </nav>
  </header>

  <main id="conteudo" class="container py-5">
  <section class="success-panel mx-auto text-center"
    aria-labelledby="titulo-sucesso">

    <div class="success-icon" aria-hidden="true">✓</div>

    <p class="eyebrow">Loja do Seu Adalberto</p>
    <h1 id="titulo-sucesso">Pedido confirmado!</h1>

    <p class="lead" id="mensagemCliente"></p>

    <dl class="order-data">
      <div>
        <dt>Número do pedido</dt>
        <dd id="numeroPedido"></dd>
      </div>

      <div>
        <dt>Produto</dt>
        <dd id="pedidoProduto"></dd>
      </div>

      <div>
        <dt>Quantidade</dt>
        <dd id="pedidoQuantidade"></dd>
      </div>

      <div>
        <dt>Subtotal</dt>
        <dd id="pedidoSubtotal"></dd>
      </div>

      <div>
        <dt>Frete</dt>
        <dd id="pedidoFrete"></dd>
      </div>

      <div>
        <dt>Total</dt>
        <dd id="pedidoTotal"></dd>
      </div>
    </dl>

    <p class="text-secondary">
      Esta compra é uma simulação educacional.
      Nenhuma cobrança foi realizada.
    </p>

    <a class="btn btn-dark" href="index.html">Voltar para a loja</a>
  </section>
</main>

  <footer class="site-footer py-4"><div class="container"><p class="mb-0">Loja do Adalberto · Nenhuma cobrança real foi realizada.</p></div></footer>
  <script defer src="js/success.js"></script>
</body>
</html>
