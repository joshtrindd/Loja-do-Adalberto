<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conheça os detalhes, materiais e modos de uso das invenções da Loja do Adalberto.">
  <title>Loja do Adalberto | Detalhes do produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111923">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Loja do Adalberto | Invenções impossíveis">
  <meta property="og:description" content="Conheça os detalhes, materiais e modos de uso das invenções da Loja do Adalberto.">
  <meta property="og:image" content="img/caneta.webp">
  <meta property="og:image:alt" content="Caneta de Desenhar Portais">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>
  <header class="site-header">
    <nav class="navbar" aria-label="Navegação principal">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="img/logo.webp" alt="Loja do Adalberto" class="logo" width="140" height="70"></a>
        <a class="nav-link" href="index.html">Produtos</a>
      </div>
    </nav>
  </header>

  <main id="conteudo" class="container py-5">
    <nav aria-label="Caminho de navegação">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Produtos</a></li>
        <li class="breadcrumb-item active" id="produtoCaminho" aria-current="page">Produto</li>
      </ol>
    </nav>
    <article class="row g-5 align-items-start">
      <div class="col-lg-6">
        <div class="product-detail-illustration">
          <img id="produtoImagem" class="img-fluid" alt="" width="800" height="800">
        </div>
      </div>
      <div class="col-lg-6">
        <p class="eyebrow" id="produtoCategoria"></p>
        <h1 id="produtoNome"></h1>
        <p class="lead" id="produtoDescricao"></p>
        <p class="price price-large" id="produtoPreco"></p>
        <section aria-labelledby="titulo-detalhes" class="mb-4">
          <h2 id="titulo-detalhes" class="h4">Detalhes</h2>
          <p id="produtoDescricaoDetalhada"></p>
          <ul id="listaDetalhes"></ul>
          <dl class="product-specs">
            <div><dt>Regra criativa</dt><dd id="produtoRegra"></dd></div>
            <div><dt>Material fictício</dt><dd id="produtoMaterial"></dd></div>
            <div><dt>Dimensões</dt><dd id="produtoDimensoes"></dd></div>
          </dl>
        </section>
        <form id="formProduto">
          <div class="mb-3">
            <label for="quantidade" class="form-label">Quantidade</label>
            <input class="form-control quantity-field" id="quantidade" name="quantidade" type="number" min="1" max="10" step="1" value="1" required>
          </div>
          <button class="btn btn-dark btn-lg" type="submit">Comprar agora</button>
        </form>
        <a class="d-inline-block mt-3" href="index.html">Voltar aos produtos</a>
        <div id="produtoFeedback" class="mt-3" role="status" aria-live="polite"></div>
      </div>
    </article>
  </main>

  <footer class="site-footer py-4"><div class="container"><p class="mb-0">Loja do Adalberto · Projeto educacional.</p></div></footer>
<script defer src="js/produtos.js"></script>
<script defer src="js/product.js"></script>
</body>
</html>
